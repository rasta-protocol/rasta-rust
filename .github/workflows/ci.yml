name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.83.0 --profile minimal
      - name: Test all features on MSRV
        run: cargo +1.83.0 test --locked --all-targets --all-features
      - name: Check no-std core on MSRV
        run: cargo +1.83.0 check --locked --no-default-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        # Installs the toolchain and components named in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --all-targets --all-features
      - name: Test optimized stack memory budget
        run: cargo test --release --test stack
      - name: Check no-std core
        run: cargo check --no-default-features
      - name: Build examples
        run: cargo build --examples --all-features
      - name: Run custom payload example
        run: cargo run --example custom_payload
      - name: Run UDP example
        run: cargo run --example udp_two_node
      - name: Validate differential fixtures
        if: runner.os == 'Linux'
        run: python3 tools/differential_harness.py
