<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="title desc">
  <title id="title">RaSTA protocol layers between two endpoints</title>
  <desc id="desc">Two endpoints, each with an application, the Safety and Retransmission Layer, the Redundancy Layer and UDP. Each layer communicates with its peer layer; the Redundancy Layers send every frame over two independent network paths.</desc>
  <style>
    .box { fill: #eef3f8; stroke: #4a6a8a; stroke-width: 1.5; }
    .app { fill: #f4f4f4; stroke: #8a8f96; }
    .srl { fill: #e6f0fb; }
    .rl { fill: #e9f5ee; stroke: #4f8a68; }
    .udp { fill: #f7f1e8; stroke: #a3825a; }
    .name { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .detail { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3e4c59; }
    .head { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #52606d; }
    .peer { stroke: #7b8794; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    .peerlabel { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3e4c59; }
    .path { stroke: #c0782b; stroke-width: 2.5; fill: none; }
    .pathlabel { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a8611c; }
    .stack { stroke: #9aa5b1; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1c2733; stroke: #7aa2c8; }
      .app { fill: #23272d; stroke: #8a8f96; }
      .srl { fill: #1a2a3d; }
      .rl { fill: #1a2e24; stroke: #6fb38c; }
      .udp { fill: #2e261b; stroke: #c9a172; }
      .name { fill: #e4e7eb; }
      .detail, .peerlabel { fill: #b8c2cc; }
      .head { fill: #9aa5b1; }
      .peer { stroke: #8a95a1; }
      .path { stroke: #e0954a; }
      .pathlabel { fill: #f0a95c; }
      .stack { stroke: #616e7c; }
    }
  </style>

  <!-- Column headings -->
  <text class="head" x="170" y="28" text-anchor="middle">Endpoint A</text>
  <text class="head" x="710" y="28" text-anchor="middle">Endpoint B</text>

  <!-- Vertical stack connectors -->
  <line class="stack" x1="170" y1="100" x2="170" y2="122"/>
  <line class="stack" x1="170" y1="212" x2="170" y2="234"/>
  <line class="stack" x1="170" y1="314" x2="170" y2="336"/>
  <line class="stack" x1="710" y1="100" x2="710" y2="122"/>
  <line class="stack" x1="710" y1="212" x2="710" y2="234"/>
  <line class="stack" x1="710" y1="314" x2="710" y2="336"/>

  <!-- Endpoint A -->
  <rect class="box app" x="40" y="44" width="260" height="56" rx="8"/>
  <text class="name" x="170" y="68" text-anchor="middle">Application</text>
  <text class="detail" x="170" y="87" text-anchor="middle">for example an interlocking</text>

  <rect class="box srl" x="40" y="122" width="260" height="90" rx="8"/>
  <text class="name" x="170" y="146" text-anchor="middle">Safety and Retransmission</text>
  <text class="name" x="170" y="164" text-anchor="middle">Layer (SRL)</text>
  <text class="detail" x="170" y="184" text-anchor="middle">connection · supervision · retransmission</text>
  <text class="detail" x="170" y="200" text-anchor="middle">flow control · MD4 safety code</text>

  <rect class="box rl" x="40" y="234" width="260" height="80" rx="8"/>
  <text class="name" x="170" y="258" text-anchor="middle">Redundancy Layer (RL)</text>
  <text class="detail" x="170" y="278" text-anchor="middle">one frame on every channel</text>
  <text class="detail" x="170" y="294" text-anchor="middle">duplicates removed · short reordering</text>

  <rect class="box udp" x="40" y="336" width="260" height="50" rx="8"/>
  <text class="name" x="170" y="366" text-anchor="middle">UDP</text>

  <!-- Endpoint B -->
  <rect class="box app" x="580" y="44" width="260" height="56" rx="8"/>
  <text class="name" x="710" y="68" text-anchor="middle">Application</text>
  <text class="detail" x="710" y="87" text-anchor="middle">for example a point controller</text>

  <rect class="box srl" x="580" y="122" width="260" height="90" rx="8"/>
  <text class="name" x="710" y="146" text-anchor="middle">Safety and Retransmission</text>
  <text class="name" x="710" y="164" text-anchor="middle">Layer (SRL)</text>
  <text class="detail" x="710" y="184" text-anchor="middle">connection · supervision · retransmission</text>
  <text class="detail" x="710" y="200" text-anchor="middle">flow control · MD4 safety code</text>

  <rect class="box rl" x="580" y="234" width="260" height="80" rx="8"/>
  <text class="name" x="710" y="258" text-anchor="middle">Redundancy Layer (RL)</text>
  <text class="detail" x="710" y="278" text-anchor="middle">one frame on every channel</text>
  <text class="detail" x="710" y="294" text-anchor="middle">duplicates removed · short reordering</text>

  <rect class="box udp" x="580" y="336" width="260" height="50" rx="8"/>
  <text class="name" x="710" y="366" text-anchor="middle">UDP</text>

  <!-- Peer communication (logical) -->
  <line class="peer" x1="300" y1="72" x2="580" y2="72"/>
  <text class="peerlabel" x="440" y="64" text-anchor="middle">messages of up to 1055 bytes</text>

  <line class="peer" x1="300" y1="167" x2="580" y2="167"/>
  <text class="peerlabel" x="440" y="146" text-anchor="middle">sequence numbers, timestamps</text>
  <text class="peerlabel" x="440" y="160" text-anchor="middle">and their confirmations</text>
  <text class="peerlabel" x="440" y="186" text-anchor="middle">heartbeats · retransmission requests</text>
  <text class="peerlabel" x="440" y="200" text-anchor="middle">timeout after T_max without confirmation</text>

  <line class="peer" x1="300" y1="274" x2="580" y2="274"/>
  <text class="peerlabel" x="440" y="266" text-anchor="middle">RL sequence number · CRC check code</text>

  <!-- Two network paths -->
  <path class="path" d="M300 352 L 580 352"/>
  <text class="pathlabel" x="440" y="344" text-anchor="middle">transport channel 1 (network path A)</text>
  <path class="path" d="M300 372 C 360 372, 370 432, 440 432 C 510 432, 520 372, 580 372"/>
  <text class="pathlabel" x="440" y="452" text-anchor="middle">transport channel 2 (network path B)</text>
</svg>
